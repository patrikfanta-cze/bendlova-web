<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 48 220 238">
<style>
  .arms { transform: translateY(80px); animation: ruce .9s .5s cubic-bezier(.3, 1.35, .5, 1) forwards; }
  .smile { opacity: 0; animation: zobraz .35s 1.5s forwards; }
  .neutral { animation: skryj .35s 1.5s forwards; }
  .head { transform-origin: 150px 200px; animation: naklon 6s 2.3s infinite; }
  .eye-open { transform-box: fill-box; transform-origin: center; animation: mrk 6s 2.3s infinite; }
  .eye-wink { opacity: 0; animation: mrk-cara 6s 2.3s infinite; }
  .brow-r { animation: oboci 6s 2.3s infinite; }
  .blush-r { transform-box: fill-box; transform-origin: center; animation: tvar 6s 2.3s infinite; }
  @keyframes ruce { to { transform: translateY(0); } }
  @keyframes zobraz { to { opacity: 1; } }
  @keyframes skryj { to { opacity: 0; } }
  @keyframes mrk { 0%, 3% { transform: scaleY(1); } 5%, 15% { transform: scaleY(.05); } 18%, 100% { transform: scaleY(1); } }
  @keyframes mrk-cara { 0%, 3% { opacity: 0; } 5%, 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
  @keyframes naklon { 0%, 2% { transform: rotate(0); } 6%, 15% { transform: rotate(-3deg); } 20%, 100% { transform: rotate(0); } }
  @keyframes oboci { 0%, 3% { transform: translateY(0); } 5%, 15% { transform: translateY(2.5px); } 18%, 100% { transform: translateY(0); } }
  @keyframes tvar { 0%, 3% { transform: scale(1); } 5%, 15% { transform: scale(1.25) translateY(-2px); } 18%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .arms, .smile, .neutral, .head, .eye-open, .eye-wink, .brow-r, .blush-r { animation: none; }
    .arms { transform: none; } .smile { opacity: 1; } .neutral { opacity: 0; }
  }
</style>
